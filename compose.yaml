
services:
  db:
    image: mysql:8.0
    container_name: srsms-php-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-srsms_root_password}
      MYSQL_DATABASE: srsms
      MYSQL_USER: ${DB_USER:-srsms}
      MYSQL_PASSWORD: ${DB_PASS:-srsms_app_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    container_name: srsms-php-web
    ports:
      - "8082:80"
    environment:
      DB_HOST: db
      DB_NAME: srsms
      DB_USER: ${DB_USER:-srsms}
      DB_PASS: ${DB_PASS:-srsms_app_password}
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
